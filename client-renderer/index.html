<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrollytelling Apple Design</title>
  </head>
  <body>
    <!-- Preloader UI -->
    <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black transition-opacity duration-500">
      <div class="text-white text-2xl font-light mb-4 tracking-tight">Loading Experience...</div>
      <div class="w-64 h-1 bg-white/20 rounded overflow-hidden">
        <div id="progress-bar" class="h-full bg-white w-0 transition-all duration-300"></div>
      </div>
    </div>

    <!-- Background Canvas -->
    <div id="canvas-container">
      <canvas id="scroll-canvas"></canvas>
    </div>

    <!-- Scroll Track -->
    <div id="track-container" class="h-[500vh]">
      <!-- UI Overlays -->
      <div id="panels-container" class="fixed inset-0 z-20 pointer-events-none flex flex-col items-center justify-center p-8">
        <!-- Panels will be injected here dynamically by main.js -->
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
